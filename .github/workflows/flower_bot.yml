name: Flower Lead Scanner HCM

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: flower-scanner-hcm-group
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install httpx openai pydantic python-dotenv playwright
          playwright install chromium --with-deps

      - name: Restore Threads Session
        env:
          THREADS_SESSION_JSON: ${{ secrets.THREADS_SESSION_JSON }}
        run: |
          if [ -n "$THREADS_SESSION_JSON" ]; then
            echo "$THREADS_SESSION_JSON" > threads_session.json
          fi

      - name: Run Flower Scanner (With Auto-Retry)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          SUCCESS=0
          for attempt in 1 2 3; do
            echo ">>> [Lần thử $attempt/3] Đang chạy trình quét khách đặt hoa..."
            if python cloud_scanner.py; then
              echo "✅ Quét thành công ở lần thử $attempt!"
              SUCCESS=1
              break
            fi
            echo "⚠️ Lần thử $attempt gặp sự cố, đợi 10 giây trước khi thử lại..."
            sleep 10
          done
          if [ $SUCCESS -eq 0 ]; then
            echo "❌ Cả 3 lần thử đều thất bại!"
            exit 1
          fi

      - name: Save Processed Leads DB Safely
        if: always()
        run: |
          git config user.name "flower-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ -f threads_flower_leads.db ]; then
            git add threads_flower_leads.db
            if ! git diff --staged --quiet; then
              git commit -m "Auto-update processed leads DB [skip ci]"
              git pull --rebase origin main || true
              git push origin main || true
            fi
          fi

      - name: Send Telegram Alert on Workflow Failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d text="⚠️ <b>CẢNH BÁO GIÁM SÁT 24/7:</b> Lượt quét vừa gặp sự cố sau 3 lần thử lại. Hệ thống sẽ tự động chạy lại ở chu kỳ 10 phút tiếp theo.%0A🔗 <a href='${RUN_URL}'>Xem chi tiết nhật ký tại đây</a>"
