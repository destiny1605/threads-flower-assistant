name: Flower Lead Scanner HCM

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install httpx openai pydantic python-dotenv playwright
          playwright install chromium --with-deps

      - name: Restore Threads Session
        env:
          THREADS_SESSION_JSON: ${{ secrets.THREADS_SESSION_JSON }}
        run: |
          if [ -n "$THREADS_SESSION_JSON" ]; then
            echo "$THREADS_SESSION_JSON" > threads_session.json
          fi

      - name: Run Flower Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python cloud_scanner.py

      - name: Save Processed Leads DB
        run: |
          git config user.name "flower-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ -f threads_flower_leads.db ]; then
            git add threads_flower_leads.db
            git diff --staged --quiet || git commit -m "Update processed leads DB"
            git push
          fi
